# AFS Bancada Inteligente — deploy COMPLETO na Netlify
#
# Arquitetura standalone (não depende do Muse):
#  - Site estático ......... client/dist (já compilado, commitado no projeto)
#  - API do app ............ netlify/functions/actions.mjs  (via /actions)
#  - IA em segundo plano ... netlify/functions/analyze-background.mjs
#  - Fotos/vídeo/logo ...... netlify/functions/media.mjs
#  - Banco de dados ........ Turso (libSQL) — TURSO_DATABASE_URL / TURSO_AUTH_TOKEN
#  - IA .................... API da Meta (dev.meta.ai) — AI_API_KEY /
#                            AI_API_BASE_URL / AI_MODEL
#
# Variáveis: Netlify → Site settings → Environment variables (ver
# .env.example). Depois de cadastrar/alterar variáveis, faça um novo
# deploy para as funções enxergarem os valores.
#
# Como publicar: importe o projeto do GitHub (Add new site → Import an
# existing project) ou rode `npx netlify deploy --prod` nesta pasta.
# Arrastar a pasta (Netlify Drop) NÃO sobe as funções.

[build]
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# A API do app roda na própria Netlify
[[redirects]]
  from = "/actions"
  to = "/.netlify/functions/actions"
  status = 200
  force = true

# SPA: qualquer rota volta para o index.html (o app é single-page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
